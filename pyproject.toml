[project]
name = "proyecto-ingenieria-dato"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Santiago Lillo Macías", email = "santilillomacias@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "matplotlib>=3.9.4",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pydantic>=2.14.1",
    "requests>=2.32.5",
    "scikit-learn>=1.9.1",
